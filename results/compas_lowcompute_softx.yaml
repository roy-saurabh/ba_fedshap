# BA-FedSHAP — explicit low-compute configuration for the SoftwareX demonstration.
#
# This is NOT the default full-scale configuration (configs/compas.yaml). It is an
# explicit low-compute profile designed to fit a SoftwareX demonstration on commodity
# CPU hardware (~3 min per (seed, alpha) cell). It is referenced by name in the
# accompanying manuscript Section 3.2 and in the SoftwareX submission package.
#
# Differences vs configs/compas.yaml:
#   n_clients:             50 -> 10
#   fl_rounds:             200 -> 10
#   kernelshap_coalitions: 2048 -> 64
#   dirichlet_alphas:      [0.1, 0.3, 0.5, 0.7, 1.0] -> [0.1, 0.5, 1.0]
#
# Identical to configs/compas.yaml:
#   dataset, n_features, model, local_epochs, lr, momentum, background_size,
#   dp_clip_c, dp_sigmas, seeds, n_min_group, bootstrap_b, permutation_bp,
#   drift_z_tau, protected_attrs.
#
# Note: dp_sigmas were calibrated for the full-scale fl_rounds=200 and 20% client
# sampling (T_eff=40). For this low-compute profile (fl_rounds=10, all clients
# participating), the calibration is conservative; the qualitative DP-failure-mode
# finding in the manuscript Table 1 is robust to this conservatism but not optimal
# for utility.

dataset: compas
n_clients: 10
dirichlet_alphas: [0.1, 0.5, 1.0]
protected_attrs: [sex, race]
n_features: 13
fl_rounds: 10
local_epochs: 5
lr: 0.01
momentum: 0.9
background_size: 200
kernelshap_coalitions: 64
dp_clip_c: 1.0
dp_sigmas:
  inf: 0.0
  8: 0.0848
  4: 0.1583
  2: 0.3038
  1: 0.5942
seeds: [42, 123, 456, 789, 1024]
n_min_group: 20
bootstrap_b: 2000
permutation_bp: 2000
drift_z_tau: 3.5
model: logreg
